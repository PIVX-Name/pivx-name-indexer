[indexer]
user  = www-data
group = www-data

; Unix socket rather than TCP: nginx is the only client and it is in this container, so a
; socket avoids the loopback stack and cannot be reached from outside by accident.
listen       = /run/php/php8.5-fpm-indexer.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 25
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

catch_workers_output = yes
php_admin_value[error_log] = /var/log/indexer/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
