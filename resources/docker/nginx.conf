user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    upstream php-fpm {
        server unix:/run/php/php8.5-fpm-indexer.sock;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        root        /opt/pivx-name-indexer;

        # The API returns JSON with its own error envelope; a body limit stops an
        # oversized POST from reaching PHP at all.
        client_max_body_size 64k;

        fastcgi_intercept_errors on;
        recursive_error_pages on;

        # Only the versioned API is routable. Everything else — config/, vendor/,
        # resources/, the service scripts — is not reachable over HTTP at all, rather than
        # relying on each file to defend itself.
        location ~ ^/v[0-9] {
            if ($is_args) { return 404; }
            if ($uri ~ '^/.+/+$') { return 404; }

            fastcgi_pass   php-fpm;
            fastcgi_param  SCRIPT_FILENAME  $document_root/api.php;
            include        fastcgi_params;
            fastcgi_param  PHP_VALUE open_basedir="/opt/pivx-name-indexer:/tmp:/var/log/indexer";
        }

        location / { return 404; }
    }
}
